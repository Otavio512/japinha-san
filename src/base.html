<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: barra fixa com dois modos. Tablet = relógio escuro | teclado de CPF. Administração = abas com tabelas densas e pílulas de status. */
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#16202e; --muted:#5b6676; --line:#d7dde5;
  --accent:#1d3f8f; --accent-ink:#ffffff; --signal:#f2b705; --signal-ink:#1b1400;
  --ok:#1f7a45; --ok-bg:#e2f2e8; --warn:#8a5a0c; --warn-bg:#fbefd6; --bad:#b3261e; --bad-bg:#fbe4e1; --off:#5b6676; --off-bg:#e8ecf1;
  --kiosk:#121a2b; --kiosk-ink:#f3f5f9;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --surface:#161d28; --surface-2:#1c2431; --ink:#e6ebf2; --muted:#9aa5b4; --line:#2b3545;
    --accent:#8aa8ff; --accent-ink:#0e131b; --signal:#f5c542; --signal-ink:#1b1400;
    --ok:#62d092; --ok-bg:#15301f; --warn:#f0b54a; --warn-bg:#33270f; --bad:#ff7d70; --bad-bg:#3a1814; --off:#9aa5b4; --off-bg:#232c39;
    --kiosk:#0a0f18; --kiosk-ink:#f3f5f9; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --surface-2:#1c2431; --ink:#e6ebf2; --muted:#9aa5b4; --line:#2b3545;
  --accent:#8aa8ff; --accent-ink:#0e131b; --signal:#f5c542; --signal-ink:#1b1400;
  --ok:#62d092; --ok-bg:#15301f; --warn:#f0b54a; --warn-bg:#33270f; --bad:#ff7d70; --bad-bg:#3a1814; --off:#9aa5b4; --off-bg:#232c39;
  --kiosk:#0a0f18; --kiosk-ink:#f3f5f9; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;min-height:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.005em}
h2{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.95em}

/* barra superior */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:10px max(16px,3vw);background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.brand strong{font-family:var(--f-display);font-size:23px;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.modes{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.modes a{padding:7px 14px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.modes a.on{background:var(--accent);color:var(--accent-ink)}
.subnav{display:flex;gap:4px;padding:0 max(16px,3vw);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.subnav[hidden]{display:none}
.subnav a{padding:11px 12px 9px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.subnav a.on{color:var(--ink);border-bottom-color:var(--signal)}
main{flex:1;padding:22px max(16px,3vw) 32px;width:100%;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px max(16px,3vw);border-top:1px solid var(--line);color:var(--muted);font-size:13px;background:var(--surface)}

/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* quiosque / tablet */
.kiosk-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.kiosk{display:grid;grid-template-columns:1.05fr 1fr;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);min-height:580px}
.k-clock{background:var(--kiosk);color:var(--kiosk-ink);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.k-company{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.k-time{font-family:var(--f-display);font-weight:700;font-size:clamp(76px,10vw,150px);line-height:.88}
.k-time span{color:var(--signal);font-size:.42em;margin-left:4px}
.k-date{font-size:20px;opacity:.88;margin-top:10px}
.k-date::first-letter{text-transform:uppercase}
.k-foot{font-size:13px;opacity:.6;display:flex;gap:8px;align-items:center}
.k-foot i{width:8px;height:8px;border-radius:50%;background:#4cc282;display:inline-block}
.k-panel{padding:28px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.k-panel h2{font-family:var(--f-display);font-size:30px;font-weight:700}
.cpf-display{font-family:var(--f-mono);font-size:clamp(26px,3vw,36px);letter-spacing:.05em;padding:14px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:center;white-space:nowrap;overflow-x:auto}
.cpf-display .ph{color:var(--muted);opacity:.45}
.cpf-display.err{border-color:var(--bad)}
.k-msg{min-height:22px;margin:0;font-weight:500}
.k-msg.bad{color:var(--bad)}
.k-msg.warn{color:var(--warn)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{font-family:var(--f-display);font-size:32px;font-weight:600;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:0 2px 0 var(--line);touch-action:manipulation}
.keypad button:active{transform:translateY(2px);box-shadow:none}
.keypad .fn{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--muted)}
.btn-big{font-size:19px;font-weight:600;padding:16px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.btn-big:disabled{opacity:.35;cursor:not-allowed}
.btn-big.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.who{display:flex;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:700;flex:none}
.who-name{font-size:22px;font-weight:600;line-height:1.2}
.next{border:2px solid var(--signal);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:color-mix(in srgb,var(--signal) 10%,var(--surface))}
.next span{color:var(--muted);font-size:14px}
.next strong{font-family:var(--f-display);font-size:30px;line-height:1}
.daymarks{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.daymarks li{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px;background:var(--surface-2)}
.daymarks b{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.receipt{border:1px dashed var(--muted);border-radius:12px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.receipt .ok-line{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:600;font-size:20px}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.receipt dt{color:var(--muted)}
.receipt dd{margin:0;font-weight:500}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.demo h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.demo button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column}
.demo button:hover{border-color:var(--accent)}
.demo button small{font-family:var(--f-mono);color:var(--muted)}
@media (max-width:1000px){.kiosk-wrap{grid-template-columns:1fr}}
@media (max-width:760px){.kiosk{grid-template-columns:1fr;min-height:0}.k-clock{padding:20px}.k-time{font-size:72px}.k-panel{padding:18px}}

/* administração */
.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--c,var(--line))}
.tile b{display:block;font-family:var(--f-display);font-size:40px;line-height:1}
.tile span{color:var(--muted);font-size:14px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-esc{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.dim td{color:var(--muted)}
tr.dim td.strike{text-decoration:line-through}
tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.num{text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--off-bg);color:var(--off)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.pill.idle{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.pill.done{background:var(--off-bg);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.alerts li div{display:flex;flex-direction:column}
.alerts small{color:var(--muted)}
.empty{color:var(--muted);padding:12px 0;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);min-width:0}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.sched td{padding:6px 8px}
.sched input[type=time]{width:100%;min-width:92px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.note{border-left:4px solid var(--signal);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.esp-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.esp-head span{color:var(--muted);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.esp td,.esp th{padding:6px 8px;font-size:13px}
.esp .wk td{background:var(--surface-2)}
.esp .fut td{color:var(--muted);opacity:.6}
.adj{color:var(--accent);font-weight:600}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:20px;font-size:13px;color:var(--muted)}
.sign div{border-top:1px solid var(--ink);padding-top:6px}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}

/* diálogo */
.dlg[hidden]{display:none}
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.dlg-back{position:absolute;inset:0;background:rgba(10,15,25,.55)}
.dlg-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg-box.wide{width:min(720px,100%)}
.dlg-box h2{font-family:var(--f-display);font-size:26px}
.dlg-box form{display:flex;flex-direction:column;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.form-err{color:var(--bad);margin:0;min-height:1em;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion:no-preference){.receipt{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97)}to{transform:none}}}
.auth{display:grid;place-items:center;padding:24px 0}
.auth-card{width:min(470px,100%);padding:24px;gap:16px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-card p{margin:0}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-admin{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.who-admin[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}
.badge{display:inline-flex;gap:6px;align-items:center}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.badge.local i{background:var(--warn)}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;align-items:start}
.cfg form{display:flex;flex-direction:column;gap:12px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--surface-2);border:1px solid var(--line)}
.steps li.done::before{content:"✓";background:var(--ok-bg);color:var(--ok);border-color:transparent}
.steps li div{display:flex;flex-direction:column}
.steps small{color:var(--muted);font-size:13px}
@media (max-width:600px){.steps li{grid-template-columns:36px 1fr}.steps li .btn{grid-column:2}}
.dlg-box.xwide{width:min(940px,100%)}
.itemgrid td{padding:6px 8px;vertical-align:middle}
.itemgrid input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:70px}
.itemgrid input.qty{width:84px;text-align:right}
.itemgrid input.bad{border-color:var(--bad)}
.itemgrid tr.has td{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.itemgrid tr[hidden]{display:none}
.itemgrid tr.grp td{background:var(--surface-2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px}
.scrollbox{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.scrollbox thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.price-in{width:120px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.warnbox{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.warnbox .check{color:var(--ink)}
.totalbar{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:600;border-top:2px solid var(--ink);padding-top:10px}
.totalbar span:last-child{font-family:var(--f-display);font-size:28px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:140px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;padding:4px 4px 0}
.ocard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ocard-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ocard-h b{font-family:var(--f-display);font-size:22px}
.ocard ul{margin:0;padding-left:18px;font-size:14px}
.ocard .btn{justify-content:center}
.prod-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1000px){.board{grid-template-columns:1fr}.prod-layout{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.kv span{color:var(--muted);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.hist{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.link-btn{color:var(--accent);font-weight:600}
/* ---- celular: tudo na vertical ---- */
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;cursor:pointer;line-height:1;touch-action:manipulation}
.step input.qty{width:64px;text-align:center}
.subnav{position:sticky;top:0;z-index:10}
.topbar,.subnav,.foot{flex:none}
@media (max-width:700px){
  main{padding:14px 12px 28px;gap:14px}
  .topbar{padding:8px 12px}
  .brand strong{font-size:20px}
  h1{font-size:28px}
  .page-head{flex-direction:column;align-items:stretch}
  .page-head .btn{justify-content:center;padding:12px}
  .page-head .field select{width:100%}
  .filters{flex-direction:column;align-items:stretch}
  .filters .field,.filters select{width:100%}
  .filters > span{margin-left:0!important}
  .tiles{gap:8px}
  .tile{padding:10px 12px}
  .tile b{font-size:24px}
  .tile span{font-size:13px}
  .card{padding:12px;border-radius:10px}
  .card-head{flex-direction:column;align-items:stretch}
  .card-head .field select{width:100%}
  .row2{grid-template-columns:1fr}
  .row2.keep{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr 1fr}
  .actions .btn{flex:1 1 calc(50% - 8px);justify-content:center;padding:11px 10px}
  .foot{font-size:12px;padding:10px 12px}
  /* tabelas viram cartões */
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tfoot,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;background:var(--surface)}
  table.rt tr.dim{opacity:.75}
  table.rt td{border:0;padding:5px 0;text-align:right;min-height:0}
  table.rt td::before{content:attr(data-label);float:left;margin-right:12px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  table.rt td[data-label=""]{text-align:left}
  table.rt td[data-label=""]::before{display:none}
  table.rt td:empty{display:none}
  table.rt td.first{text-align:left;font-size:16px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
  table.rt td.first::before{display:none}
  table.rt td.last{text-align:left;padding-top:8px}
  table.rt td.last::before{display:none}
  table.rt tfoot tr{border-width:2px;border-color:var(--ink)}
  table.rt td.empty{text-align:center}
  .tw{overflow:visible}
  /* grade de sabores do pedido */
  .scrollbox{max-height:none;border:0;overflow:visible}
  .itemgrid thead{display:none}
  .itemgrid,.itemgrid tbody{display:block}
  .itemgrid tr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:center}
  .itemgrid tr.grp{display:block;padding:0;border:0}
  .itemgrid tr.grp td{display:block;padding:8px 6px}
  .itemgrid td{padding:0;border:0;background:none!important}
  .itemgrid tr.has{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
  .itemgrid td:nth-child(1){grid-column:1/-1;font-weight:600}
  .itemgrid td:nth-child(2){display:none}
  .itemgrid td:nth-child(3){text-align:left}
  .itemgrid td:nth-child(4){justify-self:end}
  .itemgrid td:nth-child(5){grid-column:1/-1}
  .itemgrid td:nth-child(6){grid-column:1/-1;text-align:right;font-weight:600}
  .itemgrid tr:not(.has) td:nth-child(5),.itemgrid tr:not(.has) td:nth-child(6){display:none}
  .step button{width:44px;height:44px}
  .step input.qty{width:60px;height:44px;font-size:17px}
  /* janelas em tela cheia */
  .dlg{padding:0;place-items:stretch}
  .dlg-box,.dlg-box.wide,.dlg-box.xwide{width:100%;height:100%;max-height:100%;border-radius:0;border:0;padding:16px 14px 0}
  .dlg-box h2{font-size:24px}
  .dlg-actions{position:sticky;bottom:0;background:var(--surface);margin:0 -14px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .dlg-actions .btn{flex:1;justify-content:center;padding:13px}
  .totalbar{font-size:17px}
  .board{gap:10px}
  .ocard .actions .btn{flex:1 1 auto}
}
/* ---- sistema de pedidos ---- */
.proto{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px max(12px,3vw);background:var(--kiosk);color:var(--kiosk-ink);font-size:13px;flex:none}
.proto b{color:var(--signal)}
.proto .seg{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px}
.proto .seg a{color:var(--kiosk-ink);text-decoration:none;padding:6px 12px;border-radius:7px;font-weight:600;opacity:.75}
.proto .seg a.on{background:var(--signal);color:var(--signal-ink);opacity:1}
.proto .clock{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proto input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--kiosk-ink);border-radius:6px;padding:4px 6px;color-scheme:dark}
.proto button{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--kiosk-ink);border-radius:6px;padding:4px 8px;cursor:pointer}
.datechips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.datechips button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;min-width:92px}
.datechips button b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1}
.datechips button span{font-size:12px;color:var(--muted)}
.datechips button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.cat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cat li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:center}
.cat li.has{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.cat li[hidden]{display:none}
.cat .nm{font-weight:600}
.cat .ds{grid-column:1;font-size:13px;color:var(--muted)}
.cat .pr{font-size:14px;color:var(--muted)}
.cat .q{grid-row:1/span 3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cat .q input{width:92px;height:46px;font-size:20px;text-align:center;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--f-body)}
.cat .q input:focus{border-color:var(--accent);outline:none}
.cat .q small{font-weight:600;min-height:1em}
.cartbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);margin:0 calc(-1*max(12px,3vw));padding:10px max(12px,3vw) calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.cartbar div{display:flex;flex-direction:column}
.cartbar b{font-family:var(--f-display);font-size:24px;line-height:1}
.cartbar .btn{padding:12px 18px}
.rcpt{background:var(--surface);border:1px dashed var(--muted);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rcpt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rcpt-h b{font-family:var(--f-display);font-size:30px;line-height:1}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lines li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:15px}
.lines li .qt{font-family:var(--f-mono);min-width:44px;text-align:right}
.lines li .sb{font-variant-numeric:tabular-nums;white-space:nowrap}
.lines li small{grid-column:2;color:var(--muted);margin-top:-4px}
.sumline{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:8px;font-weight:600;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.cal button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:62px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;font-size:12px;color:var(--ink);text-align:left}
.cal button .n{font-weight:700;font-size:14px}
.cal button .c{color:var(--accent);font-weight:600}
.cal button.out{opacity:.35}
.cal button.today{border:2px solid var(--accent)}
.cal button.sel{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.cal button.blk{background:repeating-linear-gradient(135deg,var(--bad-bg),var(--bad-bg) 6px,var(--surface) 6px,var(--surface) 12px);border-color:var(--bad)}
.cal button.closed{background:var(--surface-2);color:var(--muted)}
.cal button.esp{border-color:var(--ok);border-style:dashed}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.navrow strong{text-align:center;flex:1}
.navrow .btn{flex:none;min-width:44px;justify-content:center}
@media (max-width:700px){.proto{font-size:12px;padding:6px 12px;gap:6px 10px}.proto .note-txt{display:none}.proto .seg a{padding:5px 10px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.toggle{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.toggle button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.toggle button.on{background:var(--accent);color:var(--accent-ink)}
.catgrid li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.catgrid{list-style:none;margin:0;padding:0}
.catgrid input[type=checkbox]{width:22px;height:22px}
.catgrid .price-in{width:96px}
.catgrid li.off .nm{color:var(--muted)}
.demo-cred{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.demo-cred button{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left;font-size:13px}
@media (max-width:700px){
  .cal button{min-height:54px;font-size:11px;padding:3px}
  .cal button .n{font-size:13px}
  .datechips button{min-width:84px}
}
