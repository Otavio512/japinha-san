name: Publicar site e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  site:
    name: Site (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos do site
        run: cp site/config.js site/supabase.js site/admin/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Conferir artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | .name + " " + (.size_in_bytes|tostring)'
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK do administrador
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Copiar o app de administração
        run: |
          mkdir -p www
          cp ../site/admin/index.html www/index.html
          cp ../site/config.js ../site/supabase.js www/
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar projeto Android
        run: npx cap add android
      - name: Gerar ícones
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Copiar o app para o Android
        run: npx cap sync android
      - name: Compilar APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/japinha-san-admin.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-admin
          path: japinha-san-admin.apk
          if-no-files-found: error

  release:
    name: Publicar APK
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-admin
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-${{ github.run_number }}
          name: App de administração nº ${{ github.run_number }}
          prerelease: true
          body: |
            APK do app de administração da Japinha San (versão de teste).
            Site dos clientes: https://otavio512.github.io/japinha-san/
          files: japinha-san-admin.apk
